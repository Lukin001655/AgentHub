name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: agenthub-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag
        id: release-version
        run: |
          python3 scripts/validate_sparkle_release.py validate-tag \
            "$GITHUB_REF_NAME" \
            --github-output "$GITHUB_OUTPUT"

      - name: Capture current appcast
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tag commit must already be contained in origin/main." >&2
            exit 1
          fi
          git show origin/main:appcast.xml > "$RUNNER_TEMP/current-appcast.xml"

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.4.1'

      - name: Install build dependencies
        run: brew install create-dmg libgit2

      - name: Import signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate
          echo "$CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH

          # Set keychain as default and add to search list
          security default-keychain -s $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH login.keychain

          # Allow codesign to access the key without UI prompt
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

      - name: Build app
        env:
          VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          xcodebuild -project app/AgentHub.xcodeproj \
            -scheme AgentHub \
            -configuration Release \
            -archivePath build/AgentHub.xcarchive \
            -skipPackagePluginValidation \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM=${{ secrets.TEAM_ID }} \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$VERSION" \
            archive

      - name: Export app
        run: |
          xcodebuild -exportArchive \
            -archivePath build/AgentHub.xcarchive \
            -exportPath build \
            -exportOptionsPlist app/ExportOptions.plist

      - name: Inspect exported bundle versions
        id: bundle-version
        env:
          VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          python3 scripts/validate_sparkle_release.py inspect-bundle \
            --tag "v${VERSION}" \
            --app-plist build/AgentHub.app/Contents/Info.plist \
            --current-appcast "$RUNNER_TEMP/current-appcast.xml" \
            --github-output "$GITHUB_OUTPUT"

      - name: Notarize app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          # Create zip for notarization
          ditto -c -k --keepParent build/AgentHub.app build/AgentHub.zip

          # Submit for notarization
          xcrun notarytool submit build/AgentHub.zip \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APP_PASSWORD" \
            --wait

          # Staple the ticket
          xcrun stapler staple build/AgentHub.app

      - name: Create zip for Sparkle updates
        run: |
          cd build
          # Re-create zip after stapling (the notarization zip was created before stapling)
          rm -f AgentHub.zip
          ditto -c -k --keepParent AgentHub.app AgentHub.app.zip
          # Get file size for appcast.xml
          stat -f%z AgentHub.app.zip > AgentHub.app.zip.size
          echo "Zip file size: $(cat AgentHub.app.zip.size) bytes"

      - name: Generate Sparkle signature
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "SPARKLE_PRIVATE_KEY is required for a release." >&2
            exit 1
          fi
          # Find the Sparkle sign_update tool
          SIGN_UPDATE=$(find ~/Library/Developer/Xcode/DerivedData -name sign_update -type f -print -quit 2>/dev/null)
          if [ -n "$SIGN_UPDATE" ]; then
            echo "$SPARKLE_PRIVATE_KEY" | "$SIGN_UPDATE" build/AgentHub.app.zip --ed-key-file - > build/sparkle-signature.txt
            cat build/sparkle-signature.txt
          else
            echo "Sparkle sign_update tool was not found." >&2
            exit 1
          fi

      - name: Create DMG
        run: |
          create-dmg \
            --volname "AgentHub" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "AgentHub.app" 150 185 \
            --app-drop-link 450 185 \
            --hide-extension "AgentHub.app" \
            build/AgentHub.dmg \
            build/AgentHub.app

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          # Submit DMG for notarization
          xcrun notarytool submit build/AgentHub.dmg \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APP_PASSWORD" \
            --wait

          # Staple the ticket to the DMG
          xcrun stapler staple build/AgentHub.dmg

      - name: Generate checksums
        run: |
          cd build
          shasum -a 256 AgentHub.dmg > AgentHub.dmg.sha256
          shasum -a 256 AgentHub.app.zip > AgentHub.app.zip.sha256
          cat AgentHub.dmg.sha256
          cat AgentHub.app.zip.sha256

      # Release invariant: values published to Sparkle come from the exported
      # application bundle. The Git tag is an independently validated input.
      - name: Prepare appcast item
        env:
          VERSION: ${{ steps.release-version.outputs.version }}
          BUNDLE_VERSION: ${{ steps.bundle-version.outputs.machine_version }}
          BUNDLE_SHORT_VERSION: ${{ steps.bundle-version.outputs.display_version }}
        run: |
          PUB_DATE=$(date -u "+%a, %d %b %Y %H:%M:%S %z")

          if [ ! -s build/sparkle-signature.txt ]; then
            echo "sparkle-signature.txt is required for a release." >&2
            exit 1
          fi
          ED_SIGNATURE=$(grep -o 'edSignature="[^"]*"' build/sparkle-signature.txt | head -1 | sed 's/edSignature="//;s/"//')
          if [ -z "$ED_SIGNATURE" ]; then
            ED_SIGNATURE=$(head -1 build/sparkle-signature.txt)
          fi
          LENGTH=$(cat build/AgentHub.app.zip.size)

          {
            echo '    <item xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">'
            echo "      <title>Version ${BUNDLE_SHORT_VERSION}</title>"
            echo "      <link>https://github.com/jamesrochabrun/AgentHub/releases/tag/v${VERSION}</link>"
            echo "      <sparkle:version>${BUNDLE_VERSION}</sparkle:version>"
            echo "      <sparkle:shortVersionString>${BUNDLE_SHORT_VERSION}</sparkle:shortVersionString>"
            echo '      <description><![CDATA['
            echo "        <h2>Version ${BUNDLE_SHORT_VERSION}</h2>"
            echo '        <ul>'
            echo '          <li>See release notes on GitHub</li>'
            echo '        </ul>'
            echo '      ]]></description>'
            echo "      <pubDate>${PUB_DATE}</pubDate>"
            echo '      <enclosure'
            echo "        url=\"https://github.com/jamesrochabrun/AgentHub/releases/download/v${VERSION}/AgentHub.app.zip\""
            echo "        sparkle:version=\"${BUNDLE_VERSION}\""
            echo "        sparkle:shortVersionString=\"${BUNDLE_SHORT_VERSION}\""
            echo "        sparkle:edSignature=\"${ED_SIGNATURE}\""
            echo "        length=\"${LENGTH}\""
            echo '        type="application/octet-stream" />'
            echo '      <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>'
            echo '    </item>'
          } > build/new_item.xml

      - name: Validate release metadata
        env:
          VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          python3 scripts/validate_sparkle_release.py validate-release \
            --tag "v${VERSION}" \
            --app-plist build/AgentHub.app/Contents/Info.plist \
            --current-appcast "$RUNNER_TEMP/current-appcast.xml" \
            --candidate-item build/new_item.xml

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/AgentHub.dmg
            build/AgentHub.dmg.sha256
            build/AgentHub.app.zip
            build/AgentHub.app.zip.sha256
            build/sparkle-signature.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish appcast item
        env:
          VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          # Use exactly the main revision captured before build. Release jobs
          # are serialized; a changed feed fails closed instead of overwriting.
          git checkout -B main origin/main
          if ! cmp -s "$RUNNER_TEMP/current-appcast.xml" appcast.xml; then
            echo "appcast.xml changed during the release job." >&2
            exit 1
          fi

          # Insert new item as first <item> in appcast.xml (after the <language> line)
          awk '/<language>en<\/language>/{print; print ""; while ((getline line < "build/new_item.xml") > 0) print line; next}1' appcast.xml > appcast_tmp.xml
          mv appcast_tmp.xml appcast.xml

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "Update appcast.xml for v${VERSION}"
          git push origin main
